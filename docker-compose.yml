# Postgres for the integration lane. Nothing else in this repo needs it —
# `npm test` runs without a database.
#
#   docker compose up -d postgres
#   RC_INTEGRATION=1 DATABASE_URL=postgres://rc:rc@127.0.0.1:55433/rc npm run test:integration
#   docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc
      POSTGRES_DB: rc
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 2s
      timeout: 3s
      retries: 20
